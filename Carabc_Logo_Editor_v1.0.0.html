/* v1.0.0 — simplified composition workspace */
.source-strip{display:grid;grid-template-columns:1.22fr 1fr;gap:12px;margin:12px 0 14px}

/* v1.0.0: responsive positioning controls; safe for longer translations */
.placement-grid-wrap{
  display:grid;
  grid-template-columns:max-content minmax(0,1fr);
  align-items:start;
  gap:16px;
  width:100%;
  min-width:0;
}
.anchor-grid{align-self:start}
.offsets{
  display:flex;
  flex-direction:column;
  flex:initial;
  gap:10px;
  min-width:0;
  width:100%;
}
.offset-control{display:flex;flex-direction:column;gap:5px;min-width:0}
.offset-control label{display:block;max-width:100%;overflow-wrap:anywhere;font-size:11px;line-height:1.4}
.offset-control input{width:100%;min-width:0;max-width:100%;height:37px;font-size:13px}
.placement-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:23px}
.placement-actions .btn{width:100%;min-width:0;max-width:100%;padding:9px 7px;white-space:normal;text-align:center;line-height:1.4;overflow-wrap:anywhere}
@container (max-width:230px){.placement-grid-wrap{grid-template-columns:1fr}.offsets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}
.composition-column>.inner-panel{container-type:inline-size}
</style>

function jpegProfile(bytes){
 if(bytes.length<20||bytes[0]!==255||bytes[1]!==216||bytes[bytes.length-2]!==255||bytes[bytes.length-1]!==217)return null;
 let i=2,frame=null;
 while(i+3<bytes.length){
  if(bytes[i++]!==255)return null;
  while(i<bytes.length&&bytes[i]===255)i++;
  const marker=bytes[i++];
  if(marker===218)break;
  if(marker===1||(marker>=208&&marker<=215))continue;
  if(i+2>bytes.length)return null;
  const size=(bytes[i]<<8)|bytes[i+1];
  if(size<2||i+size>bytes.length)return null;
  if(marker>=192&&marker<=207&&![196,200,204].includes(marker)){
   if(frame||marker!==192||size<17)return null;
   const precision=bytes[i+2],height=(bytes[i+3]<<8)|bytes[i+4],width=(bytes[i+5]<<8)|bytes[i+6],components=bytes[i+7];
   if(precision!==8||components!==3||size<8+3*components)return null;
   const sampling=[];
   for(let c=0;c<components;c++)sampling.push(bytes[i+8+3*c+1]);
   frame={width,height,sampling:sampling.map(x=>x.toString(16).padStart(2,'0')).join('-'),baseline:true};
  }
  i+=size;
 }
 return frame;
}

function compareOriginalToCustom(source,custom){

 for(let i=0;i<a.entries.length;i++){
  const x=a.entries[i],y=b.entries[i];
  if(x.hdr!==y.hdr||x.name!==y.name||x.maintype!==y.maintype||x.subtype!==y.subtype||x.offset!==y.offset||x.stored!==y.stored||(i!==a.logo.index&&x.length!==y.length))throw Error(t('verifyLayoutError'));
 }
 const oldImage=source.subarray(a.logo.offset,a.logo.offset+a.logo.length);
 const newImage=custom.subarray(b.logo.offset,b.logo.offset+b.logo.length);
 if(!sameJpegProfile(jpegProfile(oldImage),jpegProfile(newImage)))throw Error(t('verifyLogoError'));
 const areas=[[a.logo.offset,a.logo.offset+a.logo.stored],[a.logo.hdr+0x12c,a.logo.hdr+0x130],[a.verify.offset,a.verify.offset+4]];
 let diffs=0;
 for(let i=0;i<source.length;i++)if(source[i]!==custom[i]){

 if(diffs===0)throw Error(t('verifySame'));

    const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)throw Error(t('errCanvas'));
    if(composition.bgMode==='image'&&!backgroundBitmap)throw Error(t('bgMissing'));
    drawComposition(ctx,bitmap,backgroundBitmap,w,h);
    // Prueba calidades decrecientes sin cambiar dimensiones, hasta que el JPEG quepa.
    const qualities=[0.97,0.94,0.91,0.88,0.85,0.82,0.78,0.74,0.70,0.66,0.62,0.58,0.54,0.50,0.46,0.42,0.38,0.34,0.30,0.26,0.22];
    for(const quality of qualities){
      const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
      if(!blob)throw Error(t('errConvert'));
      if(blob.size<=target){
        const bytes=new Uint8Array(await blob.arrayBuffer());
        if(!isBaselineRGBJPEG(bytes))throw Error(t('errConvertedJPEG'));
        if(!sameJpegProfile(jpegProfile(bytes),inspection.jpegProfile))throw Error(t('errJpegUnsupported'));
        return {bytes,quality:t('jpegConverted',Math.round(quality*100),shortSize(bytes.length)),qualityNumber:quality,adjusted:true,lowQuality:quality<=0.58};
      }
    }

}
function patch(original,part,verification,imageBytes){
  if(imageBytes.length>part.stored)throw Error(t('errTooLarge'));
  const out=new Uint8Array(original.length);out.set(original);
  out.fill(0,part.offset,part.offset+part.stored);
  out.set(imageBytes,part.offset);
  const dv=new DataView(out.buffer);
  dv.setUint32(part.hdr+0x12C,imageBytes.length,true);
  dv.setUint32(verification.offset,sumWords(imageBytes,0,imageBytes.length),true);
  return out;
}

function verifyPatch(original,modified,f){
  if(original.length!==modified.length)throw Error(t('errFirmwareLength'));
  const p=f.logo,v=f.verify;
  let changed=0;
  for(let i=0;i<original.length;i++){
    if(original[i]===modified[i])continue;
    changed++;
    if(!((i>=p.offset&&i<p.offset+p.stored)||(i>=p.hdr+0x12C&&i<p.hdr+0x130)||(i>=v.offset&&i<v.offset+4)))throw Error(t('errUnintendedChange',i));
  }
  const ff=parseFirmware(modified.buffer);
  if(ff.entries.length!==f.entries.length||ff.logo.offset!==f.logo.offset||ff.verify.offset!==f.verify.offset)throw Error(t('errOffsets'));
  for(let i=0;i<f.entries.length;i++){
    const a=f.entries[i],b=ff.entries[i];
    if(a.index!==b.index||a.name!==b.name||a.stored!==b.stored||a.offset!==b.offset||(a.index!==p.index&&a.length!==b.length))throw Error(t('errEntryChange'));
  }
  return {changed,checks:ff.sums.length,logoLength:ff.logo.length};
}

  setStatusParts([['readFirmware']]);await waitPaint();

function download(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function hashSHA(bytes){if(typeof crypto==='undefined'||!crypto.subtle)return 'not supported in this browser';const h=new Uint8Array(await crypto.subtle.digest('SHA-256',bytes));return [...h].map(v=>v.toString(16).padStart(2,'0')).join('')}
async function generate(skipPicker=false){
 if(!(fwArray&&inspection&&logoFile&&lastPrepared&&el('hardwareAck').checked&&el('riskAck').checked)||busy)return;
 let name;try{name=validateOutputName(el('outputName').value)}catch(err){setStatus(err.message,'error');el('outputName').focus();return}
 // Must request a native save dialog directly from the user gesture, before costly async processing.
 let saveHandle=null;
 if(!skipPicker&&typeof window.showSaveFilePicker==='function'){
  try{
   saveHandle=await window.showSaveFilePicker({suggestedName:name,types:[{description:'Allwinner firmware image',accept:{'application/octet-stream':['.img']}}],excludeAcceptAllOption:true});
   if(saveHandle.name){name=validateOutputName(saveHandle.name);el('outputName').value=name;customName=true;}
  }catch(err){if(err.name==='AbortError'){setStatusParts([['cancelSave']]);return}if(!['SecurityError','NotAllowedError','TypeError'].includes(err.name)){setStatus(t('saveFail',err.message),'error');return}showNameFallback();return}

 busy=true;reportText='';updateButtons();
 try{
  setStatusParts([['genProgress']]);await waitPaint();
  const replacement=lastPrepared; if(!replacement)throw Error(t('compositionNeedsPreflight'));
  if(replacement.lowQuality&&!confirm(t('confirmLowQuality',describePrepared(replacement))))return;
  if(!sameJpegProfile(jpegProfile(replacement.bytes),inspection.jpegProfile))throw Error(t('errJpegUnsupported'));
  const source=new Uint8Array(fwArray);
  const modified=patch(source,inspection.logo,inspection.verify,replacement.bytes);
  setStatusParts([['verifyProgress']]);await waitPaint();
  const results=verifyPatch(source,modified,inspection);
  compareOriginalToCustom(source,modified);
  const shaBefore=await hashSHA(source),shaAfter=await hashSHA(modified);
  const report=[t('reportHeader'),'',''+t('reportOriginal')+': '+fwFile.name,t('reportOutput')+': '+name,t('reportFormat')+': IMAGEWTY '+hex(inspection.version),t('reportEntries')+': '+inspection.entries.length,t('reportLength')+': '+shortSize(source.length),t('reportOriginalLogo')+': '+shortSize(inspection.logo.length),t('reportNewLogo')+': '+shortSize(replacement.bytes.length),t('reportCapacity')+': '+shortSize(inspection.logo.stored),t('reportTreatment')+': '+describePrepared(replacement),t('reportChanges')+': '+results.changed,t('reportChecks')+': '+results.checks+' / '+results.checks,t('reportAllowedOnly')+': 0',t('reportSHAOld')+': '+shaBefore,t('reportSHANew')+': '+shaAfter,'',t('reportNotCertified')].join('\r\n');
  const outBlob=new Blob([modified],{type:'application/octet-stream'});
  if(saveHandle){const writable=await saveHandle.createWritable();try{await writable.write(outBlob);await writable.close()}catch(err){try{await writable.abort()}catch(_){}throw err}}
  else download(outBlob,name);
  reportText=report;outputReady=true;goStep(4);
  const pieces=[['generatingDone',hex(inspection.version),results.checks,results.changed.toLocaleString(locale()),describePrepared(replacement)],...(replacement.lowQuality?[['lowWarn']]:[]),saveHandle?['savedAs',name]:['downloadStarted',name],...(!saveHandle?[['noLocationPicker']]:[]),['reportNotCertified']];
  setStatusParts(pieces,'good');
 }catch(err){reportText='';setStatus(t('genFailed',err.message),'error')}
 finally{busy=false;updateButtons()}
}
